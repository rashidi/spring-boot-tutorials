name: Jules' Bi-Weekly Article
on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch: # Allows manual execution for testing

jobs:
  authoring:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Jules Agent
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            You are a Principal Software Engineer who loves sharing deep technical knowledge with the developer community.
            Every two weeks you will write a Spring Boot article based on current industry trends.

            Analyze the repository and perform the following tasks:

            1. **State & Deduplication Analysis (CRITICAL):** Scan the existing submodules to identify the core architectural concepts already covered (e.g., if `ai-pgvector` and `ai-redis` exist, the core concept is "Vector Search"). You are strictly forbidden from writing a new tutorial on a concept that already exists in the repository, regardless of the underlying technology, driver, or database used.
            2. **Trend Discovery & Topic Selection:** Search the web for current, high-impact trends in the modern Java and Spring Boot ecosystem (e.g., Spring Modulith, Hexagonal Architecture, GraalVM Native Images, OpenTelemetry, Virtual Threads, Spring Security 6, or Spring AI). Select a topic autonomously. While AI is highly relevant, you must select a non-AI topic if a stronger, uncovered engineering trend exists.
            3. **Tutorial Generation:** Craft a comprehensive tutorial skeleton following the repository's established structure and AsciiDoc format. 
            4. **Code Structure & Standards:**
               - The package name must follow the structure: `zin.rashidi.boot.<module>.<topic>` (e.g., `zin.rashidi.boot.jdbc.locking`).
               - Use the exact same Spring Boot and Java versions as the other submodules.
               - Adhere strictly to modern Java and Spring Boot best practices.
            5. **Testing:** The tutorial must be equipped with integration tests using Testcontainers to demonstrate that it is working.
            6. **Documentation:** Include a `README.adoc` in the submodule that provides a detailed, technical explanation of the implementation in the form of a tutorial. Look at the existing submodules for references.

            Create a pull request with your changes once complete. If you fail to build the module locally, proceed to create the pull request and I will review it.
