name: Sync Submodule READMEs to Antora

on:
  push:
    branches:
      - master
    paths:
      - '**/README.adoc'
      - '**/sync-adoc.yml'

permissions:
  contents: write

jobs:
  sync-to-antora:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Branch
        uses: actions/checkout@v7
        with:
          path: master
          fetch-depth: 0

      - name: Checkout Antora Branch
        uses: actions/checkout@v7
        with:
          ref: antora
          path: antora
          token: '${{ secrets.ANTORA_FILE_SYNC }}'

      - name: Sync AsciiDoc files and generate nav.adoc
        run: |
          set -euo pipefail
          cd master

          DEST_DIR="../antora/docs/modules/ROOT/pages"
          NAV_FILE="../antora/docs/modules/ROOT/nav.adoc"

          mkdir -p "$DEST_DIR"

          declare -A CATEGORIES

          # Find two-level tutorial READMEs and retain unique Antora page names
          while IFS= read -r file; do
            MODULE_PATH=${file#./}
            MODULE_PATH=${MODULE_PATH%/README.adoc}
            CATEGORY_DIR="${MODULE_PATH%%/*}"
            case "$MODULE_PATH" in
              core/*) MODULE_NAME=${MODULE_PATH#core/} ;;
              modulith/core) MODULE_NAME=modulith ;;
              *) MODULE_NAME=${MODULE_PATH//\//-} ;;
            esac
            DEST_DOC="${DEST_DIR}/${MODULE_NAME}.adoc"

            # Normalize line endings and relative tutorial/source links for flattened Antora pages
            python3 - "$file" "$DEST_DOC" "$CATEGORY_DIR" <<'PY'
          import re
          import sys
          from pathlib import Path

          source, destination, category = sys.argv[1:]

          def tutorial_xref(match):
              target_category = match["category"] or category
              topic = match["topic"]
              if not Path(target_category, topic, "README.adoc").is_file():
                  return match[0]
              if target_category == "core":
                  page = topic
              elif (target_category, topic) == ("modulith", "core"):
                  page = "modulith"
              else:
                  page = f"{target_category}-{topic}"
              return f"xref:{page}.adoc["

          content = Path(source).read_text(encoding="utf-8").replace("\r", "")
          content = re.sub(
              r"^(:source-(?:main|test):\s*)(?=src/)",
              r"\1{url-quickref}/",
              content,
              flags=re.MULTILINE,
          )
          content = re.sub(
              r"link:(?=src/)",
              r"link:{url-quickref}/",
              content,
          )
          content = re.sub(
              r"link:\.\./(?:\.\./(?P<category>[\w-]+)/)?(?P<topic>[\w-]+)/?\[",
              tutorial_xref,
              content,
          )
          Path(destination).write_text(content, encoding="utf-8")
          PY

            # Extract title and strip any stray carriage returns
            TITLE=$(grep -m 1 "^= " "$DEST_DOC" | sed 's/^= //' || true)
            if [ -z "$TITLE" ]; then
              TITLE="$MODULE_NAME"
            fi

            case "$MODULE_NAME" in
              actuator-*|observability*)
                CATEGORY_TITLE="Observability"
                ;;
              architecture-*|architecture)
                CATEGORY_TITLE="Architecture"
                ;;
              ai-*|spring-ai)
                CATEGORY_TITLE="Spring AI"
                ;;
              batch-*|spring-batch)
                CATEGORY_TITLE="Spring Batch"
                ;;
              cloud-*|spring-cloud)
                CATEGORY_TITLE="Spring Cloud"
                ;;
              data-*|spring-data)
                CATEGORY_TITLE="Spring Data"
                ;;
              graphql|spring-graphql)
                CATEGORY_TITLE="Spring GraphQL"
                ;;
              jdbc-*)
                CATEGORY_TITLE="Spring JDBC"
                ;;                
              jooq)
                CATEGORY_TITLE="jOOQ"
                ;;
              messaging-*|spring-messaging)
                CATEGORY_TITLE="Spring Messaging"
                ;;
              modulith*|spring-modulith)
                CATEGORY_TITLE="Spring Modulith"
                ;;
              security-*|spring-security)
                CATEGORY_TITLE="Spring Security"
                ;;
              test-*|spring-test)
                CATEGORY_TITLE="Spring Test"
                ;;
              web-*|spring-web)
                CATEGORY_TITLE="Spring Web"
                ;;
              *)
                CATEGORY_TITLE=$(printf '%s\n' "$MODULE_NAME" | sed -E 's/-/ /g; s/\b([a-z])/\U\1/g; s/\bAi\b/AI/g')
                ;;
            esac

            CATEGORIES["$CATEGORY_TITLE"]+="** xref:${MODULE_NAME}.adoc[${TITLE}]"$'\n'
          done < <(find . -mindepth 3 -maxdepth 3 -type f -name "README.adoc" ! -path "./build-logic/*" ! -path "./.gradle/*" ! -path "./build/*" | sort)

          # Write clean nav.adoc starting with Home
          printf "* xref:index.adoc[Home]\n" > "$NAV_FILE"

          # Keep Architecture at the top if present, then sort remaining categories alphabetically
          if [ -n "${CATEGORIES["Architecture"]+x}" ]; then
            printf "* Architecture\n" >> "$NAV_FILE"
            printf "%s" "${CATEGORIES["Architecture"]}" | sort -f >> "$NAV_FILE"
            unset 'CATEGORIES["Architecture"]'
          fi

          IFS=$'\n' SORTED_CATS=($(printf "%s\n" "${!CATEGORIES[@]}" | sort -f))
          unset IFS

          for CAT in "${SORTED_CATS[@]}"; do
            printf "* %s\n" "$CAT" >> "$NAV_FILE"
            printf "%s" "${CATEGORIES[$CAT]}" | sort -f >> "$NAV_FILE"
          done

      - name: Commit and Push to Antora
        run: |
          cd antora
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the specific documentation paths
          git add docs/modules/ROOT/pages/*.adoc
          git add docs/modules/ROOT/nav.adoc

          # Commit only if there are actual changes
          if git diff --staged --quiet; then
            echo "No README changes to sync.\n"
          else
            git commit -m "docs: sync updated README.adoc files from master"
            git push origin antora
          fi
