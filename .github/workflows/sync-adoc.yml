name: Sync Submodule READMEs to Antora

on:
  push:
    branches:
      - master
    paths:
      - '**/README.adoc'

permissions:
  contents: write

jobs:
  sync-to-antora:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Branch
        uses: actions/checkout@v7
        with:
          path: master
          fetch-depth: 0

      - name: Checkout Antora Branch
        uses: actions/checkout@v7
        with:
          ref: antora
          path: antora
          token: '${{ secrets.ANTORA_FILE_SYNC }}'

      - name: Sync Files and Update Nav
        run: |
          cd master

          upsert_nav_entry() {
            local nav_file="$1"
            local module_name="$2"
            local title="$3"
            local nav_entry

            awk -v module_name="$module_name" 'index($0, "xref:" module_name ".adoc[") == 0' "$nav_file" > "${nav_file}.tmp"
            mv "${nav_file}.tmp" "$nav_file"

            if [[ "$title" == *": "* ]]; then
              local group_title="${title%%:*}"
              local entry_title="${title#*: }"
              local group_entry="* ${group_title}"
              nav_entry="** xref:${module_name}.adoc[${entry_title}]"

              awk -v group_entry="$group_entry" -v nav_entry="$nav_entry" '
                BEGIN {
                  seen_group = 0
                  in_group = 0
                  inserted = 0
                }
                {
                  if (!inserted && in_group && $0 ~ /^\* / && $0 != group_entry) {
                    print nav_entry
                    inserted = 1
                    in_group = 0
                  }

                  print

                  if ($0 == group_entry) {
                    seen_group = 1
                    in_group = 1
                  } else if (in_group && $0 !~ /^\*\*/) {
                    in_group = 0
                  }
                }
                END {
                  if (!seen_group) {
                    print group_entry
                  }

                  if (!inserted) {
                    print nav_entry
                  }
                }
              ' "$nav_file" > "${nav_file}.tmp"
              mv "${nav_file}.tmp" "$nav_file"
            else
              nav_entry="* xref:${module_name}.adoc[${title}]"
              printf '%s\n' "$nav_entry" >> "$nav_file"
            fi
          }
          
          # Find all README.adoc files in subdirectories (ignores root README.adoc)
          find . -mindepth 2 -name "README.adoc" | while read file; do
            # Extract the submodule folder name (e.g., 'batch-skip-step')
            MODULE_NAME=$(basename $(dirname "$file"))
          
            # Define destination paths on the antora branch
            DEST_DIR="../antora/docs/modules/ROOT/pages"
            DEST_DOC="${DEST_DIR}/${MODULE_NAME}.adoc"
            NAV_FILE="../antora/docs/modules/ROOT/nav.adoc"
          
            # Ensure destination directory exists and copy the file
            mkdir -p "$DEST_DIR"
            cp "$file" "$DEST_DOC"
          
            # Extract the AsciiDoc Title (First line starting with '= ')
            TITLE=$(grep -m 1 "^= " "$file" | sed 's/^= //')
          
            # Fallback to the module name if the README lacks a formal title
            if [ -z "$TITLE" ]; then
              TITLE="$MODULE_NAME"
            fi

            upsert_nav_entry "$NAV_FILE" "$MODULE_NAME" "$TITLE"
          done

      - name: Commit and Push to Antora
        run: |
          cd antora
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the specific documentation paths
          git add docs/modules/ROOT/pages/*.adoc
          git add docs/modules/ROOT/nav.adoc
          
          # Commit only if there are actual changes
          if git diff --staged --quiet; then
            echo "No README changes to sync."
          else
            git commit -m "docs: sync updated README.adoc files from master"
            git push origin antora
          fi