name: Sync Submodule READMEs to Antora

on:
  push:
    branches:
      - master
    paths:
      - '**/README.adoc'
      - '**/sync-adoc.yml'

permissions:
  contents: write

jobs:
  sync-to-antora:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Branch
        uses: actions/checkout@v7
        with:
          path: master
          fetch-depth: 0

      - name: Checkout Antora Branch
        uses: actions/checkout@v7
        with:
          ref: antora
          path: antora
          token: '${{ secrets.ANTORA_FILE_SYNC }}'

      - name: Sync AsciiDoc files and generate nav.adoc
        run: |
          mkdir -p docs/modules/ROOT/pages
          
          # Copy all submodule README.adoc files and normalize CRLF -> LF
          for file in */README.adoc; do
            if [ -f "$file" ]; then
              MODULE_NAME=$(dirname "$file")
              tr -d '\r' < "$file" > "docs/modules/ROOT/pages/${MODULE_NAME}.adoc"
            fi
          done
          
          # Copy root README.adoc as index.adoc if needed
          if [ -f "README.adoc" ]; then
            tr -d '\r' < "README.adoc" > "docs/modules/ROOT/pages/index.adoc"
          fi
          
          # Generate nav.adoc
          NAV_FILE="docs/modules/ROOT/nav.adoc"
          > "$NAV_FILE"
          
          declare -A CATEGORIES
          for page in docs/modules/ROOT/pages/*.adoc; do
            FILENAME=$(basename "$page" .adoc)
            if [ "$FILENAME" = "index" ]; then
              continue
            fi
          
            # Extract title and strip any stray carriage returns
            TITLE=$(grep -m 1 "^= " "$page" | tr -d '\r' | sed 's/^= //' || true)
            if [ -z "$TITLE" ]; then
              TITLE="$FILENAME"
            fi
          
            PREFIX="${FILENAME%%-*}"
            SECOND="${FILENAME#*-}"
            SECOND="${SECOND%%-*}"
          
            case "$PREFIX" in
              ai) CATEGORY_NAME="Spring AI" ;;
              batch) CATEGORY_NAME="Spring Batch" ;;
              cloud) CATEGORY_NAME="Spring Cloud" ;;
              data) CATEGORY_NAME="Spring Data" ;;
              graphql) CATEGORY_NAME="Spring GraphQL" ;;
              jooq) CATEGORY_NAME="jOOQ" ;;
              messaging) CATEGORY_NAME="Spring Messaging" ;;
              modulith) CATEGORY_NAME="Spring Modulith" ;;
              security) CATEGORY_NAME="Spring Security" ;;
              test) CATEGORY_NAME="Spring Test" ;;
              web) CATEGORY_NAME="Spring Web" ;;
              architecture) CATEGORY_NAME="Architecture" ;;
              actuator) CATEGORY_NAME="Observability" ;;
              *)
                CATEGORY_NAME=$(echo "$PREFIX" | sed -E 's/-/ /g; s/\b([a-z])/\U\1/g')
                ;;
            esac
          
            CATEGORIES["$CATEGORY_NAME"]+="** xref:${FILENAME}.adoc[${TITLE}]"$'\n'
          done
          
          # Sort categories and write to nav.adoc
          IFS=$'\n' SORTED_CATS=($(sort <<<"${!CATEGORIES[*]}"))
          unset IFS
          
          for CAT in "${SORTED_CATS[@]}"; do
            echo "* ${CAT}" >> "$NAV_FILE"
            printf "%s" "${CATEGORIES[$CAT]}" | sort >> "$NAV_FILE"
          done

      - name: Commit and Push to Antora
        run: |
          cd antora
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the specific documentation paths
          git add docs/modules/ROOT/pages/*.adoc
          git add docs/modules/ROOT/nav.adoc
          
          # Commit only if there are actual changes
          if git diff --staged --quiet; then
            echo "No README changes to sync."
          else
            git commit -m "docs: sync updated README.adoc files from master"
            git push origin antora
          fi